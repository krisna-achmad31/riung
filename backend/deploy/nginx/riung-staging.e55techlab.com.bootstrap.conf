# Staging, step 1 of 2: HTTP only, so certbot can complete the ACME challenge
# before the TLS config references a certificate (runbook §H).
#
#   cp riung-staging.e55techlab.com.bootstrap.conf /var/www/core-shared/nginx/conf.d/riung-staging.e55techlab.com.conf
#   docker exec shared-nginx nginx -t && docker exec shared-nginx nginx -s reload
#   cd /var/www/core-shared && docker compose run --rm certbot certonly \
#     --webroot --webroot-path=/var/www_certbot --email admin@e55techlab.com \
#     --agree-tos --non-interactive -d riung-staging.e55techlab.com     (try --dry-run first)
#
# Then replace it with riung-staging.e55techlab.com.conf.
server {
    listen 80;
    server_name riung-staging.e55techlab.com;

    location /.well-known/acme-challenge/ {
        root /var/www_certbot;
    }

    location / {
        return 404;
    }
}

# riung-staging.e55techlab.com → riung-staging-api:8080 (runbook §H).
#
# Same as riung.e55techlab.com.conf except: its own rate-limit zones, the
# staging upstream, and a shared-key gate (X-Riung-Staging-Key) — staging
# accepts fake dev tokens, so it must not be reachable without the key.
#
# Install as /var/www/core-shared/nginx/conf.d/riung-staging.e55techlab.com.conf
# after the certificate exists, replace CHANGE_ME_STAGING_KEY, then ALWAYS:
#   docker exec shared-nginx nginx -t && docker exec shared-nginx nginx -s reload

limit_req_zone  $binary_remote_addr zone=riung_stg_api:10m      rate=50r/s;
limit_req_zone  $binary_remote_addr zone=riung_stg_waitlist:1m  rate=10r/m;
limit_conn_zone $binary_remote_addr zone=riung_stg_conn:10m;

server {
    listen 80;
    server_name riung-staging.e55techlab.com;

    location /.well-known/acme-challenge/ { root /var/www_certbot; }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name riung-staging.e55techlab.com;

    ssl_certificate     /etc/letsencrypt/live/riung-staging.e55techlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riung-staging.e55techlab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla "intermediate": AEAD suites only for TLS 1.2 (no CBC/SHA1).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # riung-api sets these too; keep one copy (nginx's, which also covers
    # nginx's own 404/429/502 responses).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Largest legitimate body is the Play RTDN webhook (256 KB, enforced in Go).
    client_max_body_size 512k;
    limit_req_status  429;
    limit_conn_status 429;

    # Resolve at request time so nginx still starts (and other sites stay up)
    # when riung-api is down; only this domain then answers 502.
    resolver 127.0.0.11 valid=10s;
    set $riung_upstream http://riung-staging-api:8080;

    # Staging is not public: every request (except the ACME challenge) needs
    # the shared key that staging builds of the app and Postman send.
    # CHANGE_ME_STAGING_KEY is replaced on the VPS only; the key is also the
    # GitHub secret RIUNG_STAGING_KEY. Never commit the real value.
    set $riung_staging_ok 0;
    if ($http_x_riung_staging_key = "CHANGE_ME_STAGING_KEY") {
        set $riung_staging_ok 1;
    }

    # Go trusts X-Real-IP from this proxy only, and ignores X-Forwarded-For.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
    proxy_connect_timeout 5s;
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    location /.well-known/acme-challenge/ { root /var/www_certbot; }

    location = /healthz {
        if ($riung_staging_ok = 0) { return 404; }
        limit_req zone=riung_stg_api burst=10 nodelay;
        proxy_pass $riung_upstream;
    }

    location = /v1/waitlist {
        if ($riung_staging_ok = 0) { return 404; }
        limit_req zone=riung_stg_waitlist burst=5 nodelay;
        proxy_pass $riung_upstream;
    }

    # Webhooks: staging fakes billing (DEV_BILLING), stores never call it.
    location = /v1/webhooks/google-play {
        if ($riung_staging_ok = 0) { return 404; }
        proxy_pass $riung_upstream;
    }

    location /v1/ {
        if ($riung_staging_ok = 0) { return 404; }
        limit_req  zone=riung_stg_api burst=100 nodelay;
        limit_conn riung_stg_conn 100;
        proxy_pass $riung_upstream;
    }

    # Everything else, including /readyz, is not public.
    location / {
        return 404;
    }
}

name: Backend

on:
  push:
    branches: [main, feat/go-backend]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this commit to production after the image is pushed"
        type: boolean
        default: false

permissions:
  contents: read

# Only pull requests cancel an older run: a push or a dispatch may be in the
# middle of a deploy (migration), which must never be interrupted.
concurrency:
  group: backend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Same toolchain as backend/Dockerfile (and go.mod "toolchain"): the
          # go.mod "go" line is only the minimum, and its .0 release carries
          # standard-library CVEs that govulncheck rightly reports.
          go-version: "1.27.2"
          cache-dependency-path: backend/go.sum

      - name: Verify modules
        run: go mod verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Tests (unit + Postgres integration)
        env:
          RIUNG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: backend

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Tag = 7-char sha, as in CHANGELOG.md and `riung version`.
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/riung-api:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}
          load: true
          push: false
          provenance: false

      - name: Scan image (Trivy)
        # Pinned to a commit: trivy-action tags were rewritten after the March
        # 2026 supply-chain incident. v0.36.0 = signed tag a9c7b0f.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Every push to main / feat/go-backend (and every dispatch) publishes its
      # image, so any commit can be deployed or rolled back to; PRs never push.
      - name: Push to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  # Production deploy over SSH as user `deploy`, whose key is bound to
  # /usr/local/bin/riung-ci-deploy (backend/deploy/riung-ci-deploy.sh): it can
  # only compare the compose files and deploy a riung-api tag.
  # Run: Actions → Backend → Run workflow → deploy ✓ (or
  # `gh workflow run Backend --ref <branch> -f deploy=true`). Pushes to main
  # deploy by themselves only when vars.RIUNG_DEPLOY_ENABLED == 'true'.
  deploy:
    name: Deploy to VPS
    needs: image
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RIUNG_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # deploy.sh and the compose file are copied to the VPS by an admin; a
      # commit that changes them must not be deployed with the old copies.
      - name: Compare compose files with the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" check > vps.sha256
          sha256sum deploy/deploy.sh deploy/docker-compose.prod.yml | sed 's|deploy/||' > repo.sha256
          if ! diff -u vps.sha256 repo.sha256; then
            echo "::error::deploy.sh / docker-compose.prod.yml on the VPS differ from this commit. Copy them first (backend/deploy/README.md §G), then rerun."
            exit 1
          fi

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          TAG: ${{ needs.image.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$HOST" deploy "$TAG"

      - name: Smoke test
        run: |
          for path in /healthz /v1/config; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://riung.e55techlab.com$path")"
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done

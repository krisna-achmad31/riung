name: Backend

on:
  push:
    branches: [main, feat/go-backend]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this commit to production after the image is pushed"
        type: boolean
        default: false
      rollback_tag:
        description: "Rollback only: deploy this existing image tag (7-char sha) without building"
        type: string
        default: ""

permissions:
  contents: read

# Only pull requests cancel an older run: a push or a dispatch may be in the
# middle of a deploy (migration), which must never be interrupted.
concurrency:
  group: backend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Test & lint
    if: ${{ !inputs.rollback_tag }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Same toolchain as backend/Dockerfile (and go.mod "toolchain"): the
          # go.mod "go" line is only the minimum, and its .0 release carries
          # standard-library CVEs that govulncheck rightly reports.
          go-version: "1.27.2"
          cache-dependency-path: backend/go.sum

      - name: Verify modules
        run: go mod verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Tests (unit + Postgres integration)
        env:
          RIUNG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall
          working-directory: backend

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Tag = 7-char sha, as in CHANGELOG.md and `riung version`.
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/riung-api:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}
          load: true
          push: false
          provenance: false

      - name: Scan image (Trivy)
        # Pinned to a commit: trivy-action tags were rewritten after the March
        # 2026 supply-chain incident. v0.36.0 = signed tag a9c7b0f.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Every push to main / feat/go-backend (and every dispatch) publishes its
      # image, so any commit can be deployed or rolled back to; PRs never push.
      - name: Push to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  # Production deploy: backend-deploy.yml (SSH as user `deploy`, forced
  # command, smoke test). Run: Actions → Backend → Run workflow → deploy ✓, or
  # `gh workflow run Backend --ref <branch> -f deploy=true`. Pushes to main
  # deploy by themselves only when vars.RIUNG_DEPLOY_ENABLED == 'true'.
  deploy:
    needs: image
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy && !inputs.rollback_tag) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RIUNG_DEPLOY_ENABLED == 'true')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend-deploy.yml
    with:
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit

  # Rollback: `gh workflow run Backend --ref <branch> -f rollback_tag=<sha7>`
  # redeploys an image already in GHCR; no test or build (the tag was tested
  # when it was built).
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_tag
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/backend-deploy.yml
    with:
      tag: ${{ inputs.rollback_tag }}
    secrets: inherit

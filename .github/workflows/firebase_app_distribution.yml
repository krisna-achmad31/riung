name: CI/CD Build and Distribute

# Android → Firebase App Distribution, iOS → TestFlight (docs/plan-ios-testflight.md).
# Runs on push to main/master (app changes only) or by hand (Run workflow).
# Never on pull_request: the iOS signing secrets must not reach fork PRs
# (the repository is public).
on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/backend*.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Build iOS and upload to TestFlight"
        type: boolean
        default: true
      android:
        description: "Build Android and send to Firebase App Distribution"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and Distribute Android
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./riung
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Firebase Config Files
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: tester
          file: riung/build/app/outputs/flutter-apk/app-release.apk

  # Signed App Store build → App Store Connect → TestFlight (internal group
  # "riung"). Signing is manual for this build only: the workflow installs the
  # distribution certificate + "Riung Production" profile in a temporary
  # keychain and switches the Runner target's Release config to them; the
  # committed project keeps automatic signing for Xcode on developer Macs.
  build-ios:
    name: iOS → TestFlight
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./riung
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Newest stable Xcode on the image: App Store Connect only accepts builds
      # made with a recent SDK.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Setup Firebase Config Files
        run: |
          cat << 'EOF' > ios/Runner/GoogleService-Info.plist
          ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          EOF

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_APPSTORE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/riung-signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          kc_password="$(openssl rand -hex 24)"
          security create-keychain -p "$kc_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$kc_password" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # codesign may use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "iPhone Distribution" ||
            { echo "::error::no 'iPhone Distribution' identity in IOS_DIST_P12_BASE64"; exit 1; }

          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" | plutil -extract UUID raw -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$RUNNER_TEMP/appstore.mobileprovision" "$dir/$uuid.mobileprovision"
          done

      - name: Use manual signing for this Release build
        run: |
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj --no-document
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            runner = project.targets.find { |t| t.name == "Runner" } or abort "no Runner target"
            runner.build_configurations.select { |c| c.name == "Release" }.each do |c|
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = "C75S43V9FY"
              s["CODE_SIGN_IDENTITY"] = "iPhone Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "iPhone Distribution"
              s["PROVISIONING_PROFILE_SPECIFIER"] = "Riung Production"
            end
            project.save'

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$build_number" >> "$GITHUB_ENV"
          flutter build ipa --release --build-number="$build_number" --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ipa="$(ls build/ios/ipa/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo "### TestFlight: Riung $APP_VERSION ($APP_BUILD)"
            echo "Commit \`${GITHUB_SHA::7}\` diunggah; tersedia untuk grup internal setelah diproses Apple (±10–30 menit)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Crash reports with readable stack traces. Not fatal: the build is
      # already in TestFlight.
      - name: Upload dSYMs to Crashlytics
        continue-on-error: true
        run: |
          upload="$(find build/ios "$HOME/Library/Developer/Xcode/DerivedData" -path '*Crashlytics/upload-symbols' -type f 2>/dev/null | head -1)"
          [ -n "$upload" ] || { echo "::warning::upload-symbols not found; dSYMs not sent to Crashlytics"; exit 0; }
          "$upload" -gsp ios/Runner/GoogleService-Info.plist -p ios build/ios/archive/Runner.xcarchive/dSYMs

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/appstore.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
